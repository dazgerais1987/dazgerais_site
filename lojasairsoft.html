        <img class="img_banner" src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgQE-hDv5b8K5odIpwKEKnLKVQDTD0dSmi_DVxHlQ_ttzjiANlHi4CY4FdOE62_TMIdXxehQBrKAxFBwSucwAj4ixH36TYeNLzYKipMYTW2elKDjMRLebs6yfynGyHa8KojRGY15A7-6xA_dToMab-UbXG6Dk32Ngt-K3muQ5tWVlTKb3RM0PJA6HT0YDPU/s1793/banner_dazgerais.png" alt="Banner Daz Gerais">
    </header>

    <nav class="nav_menu">
        <ul class="menu">
            <li><a href="airsoft.html">HOME</a></li>
            <li><a href="camposairsoft.html">CAMPOS DE AIRSOFT</a></li>
            <li><a href="lojasairsoft.html"><u>LOJAS DE AIRSOFT</u></a></li>
            <li><a href="contato.html">CONTATO</a></li>
        </ul>
    </nav>

    <main class="container">
        <div class="conteudos">
            <section class="section_galerias">
                <h1>Escolha sua localização:</h1>

                <div class="grupo-campo">
                    <label for="estado">Estado:</label>
                    <select id="estado">
                    <option value="">Selecione um estado...</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="SP">São Paulo</option>
                    </select>
                </div>

                <div class="grupo-campo">
                    <label for="cidade">Cidade:</label>
                    <select id="cidade" disabled>
                        <option value="">Primeiro escolha um estado</option>
                    </select>
                </div>

                
                <p>Demais cidades e estados em criação...</p>
                <p>Deseja divulgar sua loja de airsoft? Solicite em: <a href="contatoairsoft.html">Entre em contato!</a></p>

                <script>
                    // 1. Mapeamento de estados, cidades e suas respectivas páginas HTML
                    const dadosCidades = {
                    SP: [
                        { nome: "Diadema", url: "#" },
                        { nome: "Santo André", url: "#" },
                        { nome: "São Bernardo do Campo", url: "sbclojas.html" },
                        { nome: "São Caetano do Sul", url: "scslojas.html" }
                    ],
                    RJ: [
                        { nome: "Rio de Janeiro", url: "#" },
                        { nome: "Niterói", url: "#" }
                    ],
                    MG: [
                        { nome: "Belo Horizonte", url: "#" },
                        { nome: "Uberlândia", url: "#" }
                    ]
                    };

                    const selectEstado = document.getElementById("estado");
                    const selectCidade = document.getElementById("cidade");

                    // 2. Evento disparado ao escolher um Estado
                    selectEstado.addEventListener("change", function () {
                    const estadoSelecionado = this.value;

                    // Limpa as opções anteriores da caixa de cidade
                    selectCidade.innerHTML = '<option value="">Selecione uma cidade...</option>';

                    if (estadoSelecionado && dadosCidades[estadoSelecionado]) {
                        // Habilita o campo de cidade
                        selectCidade.disabled = false;

                        // Preenche as cidades do estado escolhido
                        dadosCidades[estadoSelecionado].forEach(function (cidade) {
                        const option = document.createElement("option");
                        option.value = cidade.url; // O valor da opção será o link da página
                        option.textContent = cidade.nome;
                        selectCidade.appendChild(option);
                        });
                    } else {
                        // Bloqueia novamente se voltar para "Selecione um estado..."
                        selectCidade.disabled = true;
                        selectCidade.innerHTML = '<option value="">Primeiro escolha um estado</option>';
                    }
                    });

                    // 3. Evento disparado ao escolher uma Cidade (Redirecionamento)
                    selectCidade.addEventListener("change", function () {
                    const paginaDestino = this.value;

                    if (paginaDestino) {
                        // Redireciona na mesma aba
                        window.location.href = paginaDestino;
                        
                        // Dica: Se quiser abrir em uma nova aba, troque a linha acima por:
                        // window.open(paginaDestino, "_blank");
                    }
                    });
                </script>
            </section>
        </div>
    </main>
