<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" type="text/css" href="style.css">
    <title>Unidades de Medida</title>
</head>
<body>
    <header class="cabecario">
        <img class="img_logo" src="https://raw.githubusercontent.com/dazgerais1987/dazgerais_site/182e0f725646dd9a6cc720cc0e5c92e4c1443fe8/logo_dazgerais.png" alt="Logo Daz Gerais">
        <img class="img_banner" src="https://raw.githubusercontent.com/dazgerais1987/dazgerais_site/182e0f725646dd9a6cc720cc0e5c92e4c1443fe8/banner_dazgerais.png" alt="Banner Daz Gerais">
    </header>

    <nav class="nav_menu">
        <ul class="menu">
            <li><a href="index.html">HOME</a></li>
            <li><a href="dazgerais.html"><u>DAZGERAIS</u></a></li>
            <li><a href="airsoft.html">AIRSOFT</a></li>
            <li><a href="sobre.html">SOBRE</a></li>
            <li><a href="contato.html">CONTATO</a></li>
        </ul>
    </nav>

    <main class="container">
        <div class="conteudos">
            <section class="section_paginas">
                <article class="artigos_paginas">

                    <div class="barras">
                        <label for="valorConverter">Valor a ser convertido:</label>
                        <input type="number" step="0.01" id="valorConverter" placeholder="Insira o valor aqui">
                    </div>

                    <div class="botoes">

                        <form action="">
                            <!-- Seleção da Conversão -->
                            <label for="converter">Converta:</label>
                            <select name="converter" id="converter">
                                <option value="" disabled selected>Selecione o tipo de medida:</option>
                                <option value="" disabled>---------------------------------</option>
                                <option value="" disabled>Brasileiras para Americanas:</option>
                                <option value="cmPolegadas">Centímetros para Polegadas</option>
                                <option value="cmPes">Centímetros para Pés</option>
                                <option value="metrosJardas">Metros para Jardas</option>
                                <option value="kmMilhas">Quilômetros para Milhas</option>
                                <option value="kmMilhasNauticas">Quilômetros para Milhas Náuticas</option>
                                <option value="gramasOncas">Gramas em Onças</option>
                                <option value="quiloLibras">Quilos em Libras</option>
                                <option value="litrosOncasFluidas">Litros em Onças Fluidas</option>
                                <option value="litrosGalao">Litros em Galões</option>
                                <option value="grausFahrenheit">Graus Celsius em Fahrenheit</option>
                                <option value="" disabled>---------------------------------</option>
                                <option value="" disabled>Americanas para Brasileiras:</option>
                                <option value="polegadasCentimetro">Polegadas em Centimetro</option>
                                <option value="pesMetros">Pés em Metros</option>
                                <option value="jardasMetros">Jardas em Metros</option>
                                <option value="milhasKm">Milhas em Quilômetros</option>
                                <option value="milhasNauticasKm">Milhas Naúticas em Quilômetros</option>
                                <option value="oncasGramas">Onças em Gramas</option>
                                <option value="fahrenheitGraus">Fahrenheit em Graus Celsius</option>
                            </select>
                        </form>

                        <p id="resultado"></p>

                        <p>*Valores são arredondados pois os valores convertidos das medidas americanas para brasileiras não são exatas.
                        </p>

                    </div>

                    <p>
                        <a href="#">Voltar ao topo da página.</a>
                    </p>
                </article>
            </section>
        </div>
    </main>

    <footer class="rodape">
        <p>&copy; Daz Gerais 2027</p>
        <ul class="links_rodape">
            <li>
                <a href="https://www.instagram.com/dazgerais87" target="_blank">
                    Instagram
                </a>
            </li>
        </ul>
    </footer>

    <script src="converter_medidas_americanas.js"></script>
</body>
</html>
